<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Scoreboard.css">
    <title></title>
</head>
    <div class="scoreboard">
        <h2>Scoreboard</h2>
        <div class="section">
            <h3>Player 1</h3>
            <p>Clan Prefix: <span id="clanPrefix1"></span></p>
            <p>Name: <span id="name1"></span></p>
            <p>Score: <span id="score1">0</span></p>
            <p>Country: <span id="country1"></span></p>
            <p>Character: <span id="character1"></span></p>
        </div>
        <div class="section">
            <h3>Player 2</h3>
            <p>Clan Prefix: <span id="clanPrefix2"></span></p>
            <p>Name: <span id="name2"></span></p>
            <p>Score: <span id="score2">0</span></p>
            <p>Country: <span id="country2"></span></p>
            <p>Character: <span id="character2"></span></p>
        </div>
        <div class="section">
            <h3>Round Info</h3>
            <p>Round: <span id="round"></span></p>
        </div>
        <div class="section">
            <h3>Upcoming Match</h3>
            <p>Player 1: <span id="upcoming1"></span></p>
            <p>Player 2: <span id="upcoming2"></span></p>
        </div>
        <div class="section">
            <h3>Prize Pool</h3>
            <p>Prize Pool: <span id="prizePool"></span></p>
        </div>
    </div>

<script src="Scoreboard.js"></script>
